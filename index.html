<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitácora de avance — Fichas de trabajo</title>
<meta name="description" content="Monitoreo reflexivo del avance en las tres fichas de trabajo del curso.">
<style>
  :root{
    --stone-50:#fafaf9; --stone-100:#f5f5f4; --stone-200:#e7e5e4; --stone-300:#d6d3d1;
    --stone-400:#a8a29e; --stone-500:#78716c; --stone-600:#57534e; --stone-700:#44403c;
    --stone-800:#292524; --stone-900:#1c1917;
    --teal-50:#f0fdfa; --teal-700:#0f766e; --teal-800:#115e59; --teal-900:#134e4a;
    --red-50:#fef2f2; --red-300:#fca5a5; --red-700:#b91c1c; --red-800:#991b1b; --red-900:#7f1d1d;
    --amber-50:#fffbeb; --amber-300:#fcd34d; --amber-600:#d97706; --amber-800:#92400e; --amber-900:#78350f;
    --emerald-50:#ecfdf5; --emerald-300:#6ee7b7; --emerald-700:#047857; --emerald-800:#065f46;
    --serif: Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--stone-100);color:var(--stone-900);font-family:var(--sans);font-size:16px;line-height:1.5}
  .envoltura{max-width:64rem;margin:0 auto;padding:1.5rem 1rem}
  @media(min-width:768px){.envoltura{padding:2.5rem 2rem}}

  h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0}
  h1{font-size:1.5rem;line-height:1.2}
  @media(min-width:768px){h1{font-size:1.875rem}}
  p{margin:0}
  ol,ul{margin:0;padding:0;list-style:none}

  header.cab{border-bottom:1px solid var(--stone-300);padding-bottom:1.25rem;display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:.75rem}
  .cab .sub{margin-top:.5rem;font-size:.875rem;color:var(--stone-600);max-width:36rem}
  .cab .der{display:flex;align-items:center;gap:.75rem}
  .estado-guardado{font-size:.75rem;color:var(--stone-500)}
  .estado-guardado.err{color:var(--red-700)}

  .tarjeta{border:1px solid var(--stone-300);background:#fff;border-radius:.5rem;padding:1.25rem}
  .apilado{margin-top:1.5rem}
  .nota{border:1px solid var(--stone-300);background:var(--stone-50);border-radius:.5rem;padding:1rem 1.25rem}
  .chico{font-size:.875rem;color:var(--stone-600)}
  .mini{font-size:.75rem;color:var(--stone-500)}
  .num{font-variant-numeric:tabular-nums}

  label{display:block;font-size:.875rem;color:var(--stone-800)}
  input[type=text],textarea{width:100%;margin-top:.5rem;padding:.75rem;border:1px solid var(--stone-300);border-radius:.375rem;background:#fff;color:var(--stone-900);font:inherit;font-size:.9375rem;line-height:1.6}
  textarea{min-height:7rem;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--teal-700);box-shadow:0 0 0 1px var(--teal-700)}
  ::placeholder{color:var(--stone-400)}
  .invalido{border-color:var(--red-700);box-shadow:0 0 0 1px var(--red-700)}

  button{font:inherit;font-size:.875rem;cursor:pointer;border-radius:.375rem;padding:.625rem 1rem;border:1px solid var(--stone-400);background:#fff;color:var(--stone-700)}
  button:hover{background:var(--stone-100)}
  button:focus-visible{outline:2px solid var(--teal-700);outline-offset:2px}
  button[disabled]{opacity:.6;cursor:progress}
  .btn-principal{background:var(--teal-800);border-color:var(--teal-800);color:#fff;padding:.625rem 1.25rem}
  .btn-principal:hover{background:var(--teal-900)}
  .btn-peligro{background:var(--red-700);border-color:var(--red-700);color:#fff}
  .btn-peligro:hover{background:var(--red-800)}
  .btn-enlace{border:none;background:none;padding:0;color:var(--stone-600);text-decoration:underline;text-underline-offset:2px;text-align:left}
  .btn-enlace:hover{background:none;color:var(--stone-900)}

  .franja{border:1px solid var(--stone-200);border-left:4px solid var(--teal-800);background:#fff;border-radius:.5rem;padding:1.25rem;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .franja h2{font-size:1.125rem}
  .franja .criterio-txt{margin-top:.75rem;font-family:var(--serif);font-size:1.125rem;line-height:1.35}
  .franja .pista{margin-top:.75rem;font-size:.875rem;color:var(--stone-700);max-width:42rem}
  .fila-baseline{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.5rem}

  .rejilla{display:grid;grid-template-columns:1fr;gap:1rem;margin-top:1.5rem}
  @media(min-width:768px){.rejilla{grid-template-columns:repeat(3,1fr)}}

  .barra{height:.5rem;flex:1;background:var(--stone-200);border-radius:999px;overflow:hidden}
  .barra > span{display:block;height:100%;background:var(--stone-600)}
  .barra.fina{height:.375rem;margin-top:.5rem}
  .fila-barra{display:flex;align-items:center;gap:.75rem;margin-top:.375rem}

  .figura{display:inline-block;height:.75rem;width:.75rem;flex:none}
  .fig-gris{border:2px dashed var(--stone-400);border-radius:999px}
  .fig-rojo{background:var(--red-700)}
  .fig-ambar{background:var(--amber-600);transform:rotate(45deg)}
  .fig-verde{background:var(--emerald-700);border-radius:999px}
  .caja-logro{margin-top:1rem;border:1px solid;border-radius:.375rem;padding:.625rem .75rem}
  .caja-gris{background:var(--stone-100);border-color:var(--stone-300)}
  .caja-rojo{background:var(--red-50);border-color:var(--red-300)}
  .caja-ambar{background:var(--amber-50);border-color:var(--amber-300)}
  .caja-verde{background:var(--emerald-50);border-color:var(--emerald-300)}
  .txt-rojo{color:var(--red-800)} .txt-ambar{color:var(--amber-800)} .txt-verde{color:var(--emerald-800)} .txt-gris{color:var(--stone-500)}
  .rel-rojo{background:var(--red-700)} .rel-ambar{background:var(--amber-600)} .rel-verde{background:var(--emerald-700)} .rel-gris{background:var(--stone-300)}

  .panel{border:1px solid var(--stone-300);background:#fff;border-radius:.5rem;overflow:hidden}
  .panel-cab{border-bottom:1px solid var(--stone-200);background:var(--stone-50);padding:1rem 1.25rem}
  .panel-cab h2{font-size:1.125rem;color:var(--teal-900);line-height:1.35}
  .meta{display:flex;flex-wrap:wrap;gap:.25rem .75rem;align-items:center;margin-top:.75rem;font-size:.75rem;color:var(--stone-500)}
  .aviso-base{border-bottom:1px solid var(--amber-300);background:var(--amber-50);padding:.75rem 1.25rem;font-size:.875rem;color:var(--amber-900)}
  li.criterio{padding:1rem 1.25rem;border-top:1px solid var(--stone-200);scroll-margin-top:1rem}
  li.criterio:first-child{border-top:none}
  li.criterio.resaltado{background:var(--teal-50)}
  .criterio-cuerpo{display:flex;gap:.75rem}
  .criterio-n{width:1.25rem;flex:none;font-size:.875rem;color:var(--stone-400)}
  .opciones{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.75rem}
  .opciones button{flex:1 1 8rem;border-radius:.5rem;padding:.625rem 1rem}
  @media(min-width:640px){.opciones button{flex:0 1 auto}}
  .opciones button[aria-pressed=true]{background:var(--teal-800);border-color:var(--teal-800);color:#fff}
  .pista-caja{margin-top:.75rem;border-left:2px solid var(--stone-400);padding-left:.75rem}
  .lista-reflexion > div + div{margin-top:1.25rem}
  details summary{cursor:pointer;font-size:.75rem;color:var(--stone-500)}
  .version-previa{border-left:2px solid var(--stone-300);padding-left:.75rem;font-size:.75rem;color:var(--stone-600);margin-top:.5rem}

  .msg{margin-top:.75rem;font-size:.875rem;border-radius:.375rem;padding:.75rem 1rem}
  .msg-ok{background:var(--emerald-50);border:1px solid var(--emerald-300);color:var(--emerald-800)}
  .msg-error{background:var(--red-50);border:1px solid var(--red-300);color:var(--red-800)}
  .msg-info{background:var(--amber-50);border:1px solid var(--amber-300);color:var(--amber-900)}
  .msg ul{margin-top:.5rem;padding-left:1rem;list-style:disc}
  .acciones{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;margin-top:1rem}
  .oculto{display:none}

  .envios-lista li{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .75rem;padding:.5rem 0;border-top:1px solid var(--stone-200)}
  .envios-lista li:first-child{border-top:none}
  .pastilla{display:inline-block;font-size:.75rem;border-radius:999px;padding:.125rem .625rem;border:1px solid var(--stone-300);background:var(--stone-50);color:var(--stone-600)}
  .pastilla.enviada{border-color:var(--emerald-300);background:var(--emerald-50);color:var(--emerald-800)}
</style>
</head>
<body>
<div class="envoltura">
  <header class="cab" id="cabecera"></header>
  <div id="app"></div>
</div>
<script>
/* ============================================================
   Bitácora de avance — Fichas de trabajo (versión web autónoma)
   Traducción a HTML+JS vainilla del artefacto React de Claude.
   Sin dependencias, sin build, sin CDN.

   ENVÍO POR FICHA (cambio respecto de la versión anterior):
   cada ficha se envía por separado, con su propia fecha, y se puede
   reenviar cuantas veces haga falta. Ya no se exige tener las tres
   fichas completas para poder reportar avance.
   El receptor correspondiente es apps-script-avance-por-ficha.gs,
   que escribe una fila por ficha enviada en la pestaña «avances».
   ============================================================ */

/* ---------- CONFIGURACIÓN ---------- */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbz9z3E-9RqlwIIl25nWumqDTqwwzcWuFH2MgJeKaa0dL7wRl67AcLjX4gsPBSj02kXRiA/exec";
/* ---------------------------------- */

const CLAVE = "bitacora:estado";
const ORDEN_NIVEL = {
  fundacional: 0,
  dependiente: 1,
  cierre: 2,
  "transversal-IA": 3,
};

const ETIQUETA_NIVEL = {
  fundacional: "Fundacional",
  dependiente: "Dependiente",
  cierre: "Cierre",
  "transversal-IA": "Transversal IA",
};

const FICHAS = [
  {
    id: 1,
    nombre: "Estrategia de evaluación",
    peso: "15%",
    criterios: [
      {
        n: 1,
        nivel: "fundacional",
        texto:
          "La situación de evaluación describe claramente el contexto, estudiantes y condiciones relevantes.",
        p0: "Todavía no hay una situación de evaluación reconocible. Redacta un párrafo que diga quiénes son tus estudiantes, en qué curso y ciclo están, y bajo qué condiciones reales trabajarán la evidencia: tiempo, recursos y modalidad.",
        p1: "La situación existe pero se queda en lo general. Agrega los datos que sí cambian el diseño: número de estudiantes, nivel de partida, acceso a dispositivos y el tiempo real disponible en tus sesiones.",
      },
      {
        n: 2,
        nivel: "fundacional",
        texto:
          "El logro de aprendizaje está redactado como desempeño observable y es coherente con el curso.",
        p0: "El logro aún no describe un desempeño. Reescríbelo con un verbo observable (diseña, argumenta, resuelve) más el objeto y la condición, de modo que puedas reconocer cuándo se cumple y cuándo no.",
        p1: "El logro ya tiene verbo observable, pero no cierra con el curso. Revisa el alineamiento constructivo: contrasta tu redacción con la competencia del sílabo y ajusta el nivel de exigencia para que coincidan.",
      },
      {
        n: 3,
        nivel: "dependiente",
        texto:
          "Las evidencias de aprendizaje son pertinentes y guardan relación con el logro esperado.",
        p0: "No hay evidencias declaradas. Nombra los productos o desempeños concretos que vas a recoger y que permitirían afirmar, por sí solos, que el logro se alcanzó.",
        p1: "Tus evidencias existen, pero no todas prueban el logro. Descarta las que solo muestran que hubo actividad y conserva las que dejan ver el desempeño enunciado en tu logro.",
      },
      {
        n: 4,
        nivel: "dependiente",
        texto:
          "La matriz de consistencia relaciona adecuadamente evidencias, competencias, criterios y tareas auténticas.",
        p0: "Aún no hay matriz. Arma una tabla con cuatro columnas —evidencia, competencia, criterios y tarea auténtica— y complétala fila por fila para cada evidencia que vas a recoger.",
        p1: "La matriz está incompleta o tiene filas que no se corresponden. Léela en horizontal: si una tarea no produce la evidencia de su fila, o un criterio no se puede observar en ella, corrige esa fila antes de seguir.",
      },
      {
        n: 5,
        nivel: "dependiente",
        texto:
          "El mix de evaluación incorpora momentos diagnósticos, formativos y sumativos de manera coherente.",
        p0: "No se distinguen momentos de evaluación. Ubica al menos un momento diagnóstico al inicio, dos formativos durante el proceso y uno sumativo de cierre, y precisa qué decides con cada uno.",
        p1: "Tienes momentos, pero desbalanceados o sin función clara. Define qué información recoge cada uno y qué harás con ella: si lo formativo no cambia nada de tu enseñanza, todavía es sumativo disfrazado.",
      },
      {
        n: 6,
        nivel: "dependiente",
        texto:
          "Las tareas, técnicas e instrumentos son variados y pertinentes para las evidencias seleccionadas.",
        p0: "Falta declarar tareas, técnicas e instrumentos. Para cada evidencia, define la tarea que la produce, la técnica con la que la observarás y el instrumento con el que la registrarás.",
        p1: "Hay variedad, pero no siempre pertinencia. Revisa cada par tarea–instrumento: una rúbrica analítica para un desempeño complejo y una lista de cotejo para requisitos verificables, no al revés.",
      },
      {
        n: 7,
        nivel: "cierre",
        texto:
          "Las condiciones de aplicación son realistas para el contexto y los estudiantes.",
        p0: "No has descrito cómo se aplicará. Detalla tiempos, agrupamientos, recursos y accesibilidad; sin eso, el diseño no es implementable en tu aula real.",
        p1: "Las condiciones están enunciadas, pero son optimistas. Contrasta tu cronograma con las horas efectivas del curso y prevé qué recortas si el tiempo se acorta.",
      },
      {
        n: 8,
        nivel: "transversal-IA",
        texto:
          "Se documenta el uso de IA y los ajustes realizados a los resultados generados.",
        p0: "No hay registro del uso de IA. Anota qué herramienta usaste, para qué parte del diseño y qué modificaste del resultado generado antes de incorporarlo.",
        p1: "Mencionas la IA, pero sin trazabilidad. Precisa el propósito de cada uso, qué salida aceptaste, cuál descartaste y con qué criterio pedagógico decidiste.",
      },
    ],
  },
  {
    id: 2,
    nombre: "Instrumentos de evaluación",
    peso: "15%",
    criterios: [
      {
        n: 1,
        nivel: "fundacional",
        texto:
          "La matriz de consistencia demuestra alineación entre evidencias y criterios de evaluación.",
        p0: "Todavía no hay una matriz que conecte evidencias con criterios. Constrúyela y verifica que cada evidencia tenga criterios propios, no una lista genérica repetida en todas las filas.",
        p1: "La alineación es parcial. Comprueba si cada criterio se puede observar realmente en la evidencia de su fila: si necesitas otra evidencia para juzgarlo, esa fila no está alineada.",

      {
        n: 2,
        nivel: "dependiente",
        texto:

        p1: "Los instrumentos están elegidos, pero algunos no calzan con su evidencia. Si la evidencia es un desempeño complejo, la lista de cotejo se te va a quedar corta: pasa a una rúbrica analítica.",
      },
      {
        n: 3,
        nivel: "dependiente",
        texto: "La justificación pedagógica de los instrumentos es clara y fundamentada.",
        p0: "Falta la justificación. Explica en pocas líneas por qué ese instrumento y no otro, apoyándote en la naturaleza de la evidencia y en el propósito evaluativo del momento.",
        p1: "La justificación describe más de lo que argumenta. Sustenta tu elección con criterios de validez y pertinencia, y señala qué alternativa descartaste y por qué.",

      {
        n: 4,
        nivel: "fundacional",
        texto: "El instrumento principal está alineado con el logro de aprendizaje.",
        p0: "El instrumento principal no se conecta con el logro. Ponlos lado a lado y reescribe los descriptores hasta que evalúen el desempeño que el logro enuncia.",
        p1: "Hay conexión, pero desviada. Detecta los criterios que evalúan aspectos formales o de esfuerzo y reemplázalos por criterios que apunten al desempeño central del logro.",
      },
      {
        n: 5,
        nivel: "fundacional",
        texto: "Los criterios del instrumento son observables y evaluables.",
        p0: "Los criterios aún no son observables. Reescríbelos con verbos de desempeño y evita adjetivos valorativos como «adecuado», «bueno» o «creativo» sin un referente que los defina.",
        p1: "Son observables, pero no discriminan niveles. Redacta los descriptores de modo que la diferencia entre un nivel y otro sea de calidad del desempeño, no de cantidad de elementos.",
      },
      {
        n: 6,
        nivel: "dependiente",
        texto:
          "El instrumento permite recoger evidencias relevantes para la evaluación auténtica.",
        p0: "El instrumento no está pensado para una tarea auténtica. Vincúlalo a una situación con destinatario y propósito reales, no a un ejercicio de aula desconectado del contexto.",
        p1: "Recoge información, pero pierde lo auténtico. Incorpora criterios sobre la pertinencia de la solución para el contexto y el destinatario de la tarea.",
      },
      {
        n: 7,
        nivel: "cierre",
        texto: "La validación del instrumento identifica fortalezas y ajustes necesarios.",
        p0: "No has validado el instrumento. Somételo al juicio de un colega o aplícalo en piloto sobre una evidencia real, y registra qué observaste al usarlo.",
        p1: "La validación se quedó en una aprobación general. Anota al menos dos ajustes concretos que surgieron de ella y en qué criterio o descriptor los aplicaste.",
      },
      {
        n: 8,
        nivel: "transversal-IA",
        texto:
          "Se documenta el uso de IA, incluyendo herramientas, propósito y ajustes realizados.",
        p0: "No hay documentación del uso de IA en los instrumentos. Registra la herramienta, el propósito y qué cambiaste de los descriptores generados antes de usarlos.",
        p1: "La documentación es parcial. Completa los tres elementos —herramienta, propósito y ajustes— y señala los sesgos o imprecisiones que corregiste en la salida.",
      },
    ],
  },
  {
    id: 3,
    nombre: "Monitoreo, retroalimentación y metacognición",
    peso: "15%",
    criterios: [
      {
        n: 1,
        nivel: "fundacional",
        texto:
          "La estrategia de monitoreo permite hacer seguimiento sistemático a las evidencias de aprendizaje.",
        p0: "Aún no hay estrategia de monitoreo. Define en qué momentos del curso vas a mirar las evidencias en proceso y con qué registro dejarás constancia de lo observado.",

      {

      {

        texto:
          "Se reflexiona críticamente sobre el valor agregado y los límites del uso de IA.",
        p0: "Falta la reflexión crítica. Escribe qué aportó realmente la IA a tu diseño y dónde no debe intervenir: el juicio final, los datos personales de tus estudiantes, las decisiones de calificación.",
        p1: "Reconoces los beneficios, pero no los límites. Nombra al menos un riesgo concreto —sesgo, imprecisión, dependencia, privacidad— y la medida que tomas frente a él.",
      },
    ],
  },
];

const PREGUNTAS_COMUNES = [
  "¿Cuál es la principal fortaleza de mi sistema de evaluación diseñado hasta el momento?",
  "¿Qué elemento requiere mayor ajuste antes de elaborar el entregable final?",
  "¿Cómo está agregando valor la IA a mi propuesta de evaluación?",
];

const PREGUNTA_4_F12 = "¿Mi propuesta es viable para mis estudiantes y contexto real?";
const PREGUNTA_4_F3 = "¿Qué decisiones fueron tomadas por mí y cuáles fueron apoyadas por IA?";

const preguntasDe = (fichaId) => [
  ...PREGUNTAS_COMUNES,
  fichaId === 3 ? PREGUNTA_4_F3 : PREGUNTA_4_F12,
];

/* ---------- utilidades ---------- */

const kc = (f, c) => `f${f}c${c}`;
const kr = (f, i) => `f${f}r${i}`;

const ESTADO_VACIO = {
  nombre: "",
  calificaciones: {},
  evidencias: {},
  reflexiones: {},
  historial: {},
  linea: [],
  envios: {},
};

const formatoLima = new Intl.DateTimeFormat("es-PE", {
  timeZone: "America/Lima",
  day: "2-digit",
  month: "2-digit",
  year: "numeric",
  hour: "2-digit",
  minute: "2-digit",
});

function fechaLima(iso) {
  try { return formatoLima.format(new Date(iso)); } catch { return ""; }
}

function esc(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function semaforoDe(puntaje, calificados) {
  if (calificados === 0) {
    return { banda: "gris", etiqueta: "Sin iniciar", provisional: false,
      figura: "figura fig-gris", barra: "rel-gris", texto: "txt-gris", caja: "caja-gris" };
  }
  let banda = puntaje <= 7 ? "rojo" : puntaje <= 12 ? "ambar" : "verde";
  const provisional = calificados < 8;
  if (provisional && banda === "verde") banda = "ambar";
  if (banda === "rojo") {
    return { banda, etiqueta: "Inicial", provisional,
      figura: "figura fig-rojo", barra: "rel-rojo", texto: "txt-rojo", caja: "caja-rojo" };
  }
  if (banda === "ambar") {
    return { banda, etiqueta: "En construcción", provisional,
      figura: "figura fig-ambar", barra: "rel-ambar", texto: "txt-ambar", caja: "caja-ambar" };
  }
  return { banda, etiqueta: "Consolidado", provisional,
    figura: "figura fig-verde", barra: "rel-verde", texto: "txt-verde", caja: "caja-verde" };
}

/* ---------- estado de la aplicación ---------- */

let estado = JSON.parse(JSON.stringify(ESTADO_VACIO));
let borradores = {};
let vista = { tipo: "tablero" };
let foco = null;
let confirmando = false;
let guardado = "";
let envio = { fase: "normal", ficha: null, mensaje: "", faltantes: [], confirmarIgual: false };
let tGuardado = null;
let tReflexion = null;

function limpiarEnvio() {
  if (envio.fase === "normal" && !envio.faltantes.length) return;
  envio = { fase: "normal", ficha: null, mensaje: "", faltantes: [], confirmarIgual: false };
}

/* ---------- persistencia local (respaldo del borrador) ---------- */

function cargar() {
  let datos = null;
  try {
    const bruto = localStorage.getItem(CLAVE);
    if (bruto) datos = JSON.parse(bruto);
  } catch { datos = null; }
  if (datos && typeof datos === "object") {
    estado = Object.assign({}, ESTADO_VACIO, datos);
    if (!estado.envios || typeof estado.envios !== "object") estado.envios = {};
    borradores = {};
    Object.entries(estado.reflexiones || {}).forEach(([k, v]) => {
      borradores[k] = (v && v.texto) || "";
    });
  }
}

function guardarConDebounce() {
  guardado = "guardando";
  pintarEstadoGuardado();
  clearTimeout(tGuardado);
  tGuardado = setTimeout(() => {
    try {
      localStorage.setItem(CLAVE, JSON.stringify(estado));
      guardado = "guardado";
    } catch {
      guardado = "error";
    }
    pintarEstadoGuardado();
  }, 600);
}

function consolidarReflexiones() {
  clearTimeout(tReflexion);
  tReflexion = setTimeout(() => {
    let cambio = false;
    const refl = Object.assign({}, estado.reflexiones);
    const hist = Object.assign({}, estado.historial);
    Object.entries(borradores).forEach(([k, valor]) => {
      const limpio = (valor || "").trim();
      const actual = refl[k];
      if (((actual && actual.texto) || "") === limpio) return;
      cambio = true;
      if (actual && actual.texto) hist[k] = [...(hist[k] || []), actual];
      if (limpio) refl[k] = { texto: limpio, ts: new Date().toISOString() };
      else delete refl[k];
    });
    if (cambio) {
      estado.reflexiones = refl;
      estado.historial = hist;
      guardarConDebounce();
      pintarSelloReflexiones();
    }
  }, 900);
}

/* ---------- cálculos ---------- */

function calcResumen() {
  return FICHAS.map((f) => {
    let puntaje = 0, calificados = 0, dosSinEvidencia = 0;
    f.criterios.forEach((c) => {
      const v = estado.calificaciones[kc(f.id, c.n)];
      if (v === 0 || v === 1 || v === 2) {
        calificados += 1;
        puntaje += v;
        if (v === 2 && !(estado.evidencias[kc(f.id, c.n)] || "").trim()) dosSinEvidencia += 1;
      }
    });
    const reflexiones = preguntasDe(f.id).reduce((acc, _, i) => {
      const r = estado.reflexiones[kr(f.id, i)];
      return acc + (r && r.texto ? 1 : 0);
    }, 0);
    return { ficha: f, puntaje, calificados, dosSinEvidencia, reflexiones };
  });
}

function calcPrioridades() {
  const lista = [];
  FICHAS.forEach((f) =>
    f.criterios.forEach((c) => {
      const v = estado.calificaciones[kc(f.id, c.n)];
      if (v === 0 || v === 1) lista.push({ ficha: f, criterio: c, valor: v });
    })
  );
  lista.sort((a, b) =>
    a.valor - b.valor ||
    ORDEN_NIVEL[a.criterio.nivel] - ORDEN_NIVEL[b.criterio.nivel] ||
    a.ficha.id - b.ficha.id ||
    a.criterio.n - b.criterio.n
  );
  return lista;
}

function registrarLinea(totalGlobal) {
  const linea = estado.linea || [];
  const ult = linea[linea.length - 1];
  if (ult && ult.total === totalGlobal) return;
  if (!ult && totalGlobal === 0) return;
  estado.linea = [...linea, { ts: new Date().toISOString(), total: totalGlobal }].slice(-60);
}

/* ---------- render ---------- */

function render() {
  const resumen = calcResumen();
  const prioridades = calcPrioridades();
  const totalGlobal = resumen.reduce((a, r) => a + r.puntaje, 0);
  const totalCalificados = resumen.reduce((a, r) => a + r.calificados, 0);

  document.getElementById("cabecera").innerHTML = htmlCabecera();
  const app = document.getElementById("app");
  if (vista.tipo === "tablero") {
    app.innerHTML = htmlTablero(resumen, prioridades, totalGlobal, totalCalificados);
  } else if (vista.tipo === "ficha") {
    app.innerHTML = htmlFicha(FICHAS.find((f) => f.id === vista.id), prioridades);
  } else {
    app.innerHTML = htmlBitacora();
  }
  pintarEstadoGuardado();

  if (foco) {
    const el = document.getElementById(foco);
    if (el) {
      if (el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "center" });
      const campo = el.querySelector ? el.querySelector("textarea, input") : null;
      if (el.tagName === "TEXTAREA" || el.tagName === "INPUT") el.focus();
      else if (campo && el.dataset && el.dataset.enfocarCampo === "1") campo.focus();
    }
  }
}

function pintarEstadoGuardado() {
  const el = document.getElementById("sello-guardado");
  if (!el) return;
  let texto = "listo";
  let error = false;
  if (guardado === "guardando") texto = "guardando…";
  else if (guardado === "guardado") texto = "guardado";
  else if (guardado === "error") { texto = "no se pudo guardar en este navegador"; error = true; }
  el.textContent = texto;
  el.className = error ? "estado-guardado err" : "estado-guardado";
}

function pintarSelloReflexiones() {
  document.querySelectorAll("[data-sello]").forEach((el) => {
    el.textContent = textoSello(el.getAttribute("data-sello"));
  });
}

function textoSello(clave) {
  const r = estado.reflexiones[clave];
  const versiones = (estado.historial[clave] || []).length;
  if (!r) return "Sin respuesta registrada todavía.";
  return `Última versión: ${fechaLima(r.ts)}` + (versiones ? ` · ${versiones} versión(es) anterior(es)` : "");
}

function htmlCabecera() {
  return `
    <div style="max-width:36rem">
      <h1>Bitácora de avance — Fichas de trabajo</h1>
      <p class="sub">Registra dónde estás en cada ficha y decide qué ajustar primero. Cada ficha se envía por separado, cuando la tengas lista, y puedes reenviarla cada vez que avances.</p>
    </div>
    <div class="der">
      ${vista.tipo !== "tablero" ? `<button data-accion="ir-tablero">Volver al tablero</button>` : ""}
      <span id="sello-guardado" class="estado-guardado" aria-live="polite"></span>
    </div>`;
}

/* ----- tablero ----- */

    </section>

    <div class="apilado">${htmlProximoAjuste(prioridades, totalCalificados)}</div>

        ${confirmando
          ? `<span class="chico">Se borran calificaciones, evidencias, reflexiones, historial y el registro de envíos de este navegador. Lo que ya llegó a la hoja del curso no se borra. No se puede deshacer.</span>

function htmlProximoAjuste(prioridades, totalCalificados) {
  if (totalCalificados === 0) {
    return `<section class="franja">
      <h2>Tu próximo ajuste</h2>
      <p class="pista">Todavía no has calificado ningún criterio, así que aún no hay nada que priorizar. Empieza por la ficha que tengas más avanzada: no hace falta seguir el orden ni terminar las tres.</p>
      <div class="acciones"><button class="btn-principal" data-accion="ir-criterio" data-ficha="1" data-crit="1">Empezar por la Ficha 1</button></div>
    </section>`;
  }
  if (prioridades.length === 0 && totalCalificados === 24) {
    return `<section class="franja">
      <h2>Sin ajustes pendientes</h2>
      <p class="pista">Calificaste los 24 criterios en 2. Antes de dar el diseño por cerrado, revisa tus «2» contra la evidencia anotada: abre cada ficha y verifica que en cada criterio puedas señalar dónde, exactamente, se ve eso en tu trabajo. Si no puedes señalarlo, ese criterio todavía no está en 2.</p>
    </section>`;
  }
  if (prioridades.length === 0) {
    return `<section class="franja">
      <h2>Tu próximo ajuste</h2>

  return `<section class="franja">

      <span class="mini">Ficha ${p.ficha.id} · ${esc(p.ficha.nombre)} · criterio ${p.criterio.n} · ${ETIQUETA_NIVEL[p.criterio.nivel]} · marcado en ${p.valor}</span>

/* ----- envíos: estado general en el tablero ----- */

function enviosDe(fid) {
  return (estado.envios && estado.envios[fid]) || [];
}

function htmlEstadoEnvios() {

    <ul class="envios-lista" style="margin-top:1rem">

/* ----- vista de ficha ----- */

function htmlFicha(ficha, prioridades) {
  if (!ficha) return "";
  let puntaje = 0, calificados = 0;
  ficha.criterios.forEach((c) => {

  const dependientesLogrados = ficha.criterios.some((c) => c.nivel === "dependiente" && estado.calificaciones[kc(ficha.id, c.n)] === 2);
  const secundarias = prioridades.slice(1, 3);
  const preguntas = preguntasDe(ficha.id);
  const pct = Math.round((puntaje / 16) * 100);

  return `<main>
    <div class="panel apilado">
      <div class="panel-cab">

      </div>
      ${baseSinResolver && dependientesLogrados
        ? `<p class="aviso-base">Tienes un criterio fundacional en 0 y criterios dependientes de esta misma ficha en 2. El riesgo es sostener el diseño sobre una base sin resolver: lo que está arriba puede caerse cuando corrijas lo de abajo. Resuelve primero lo fundacional.</p>`
        : ""}
      <ol>${ficha.criterios.map((c) => htmlCriterio(ficha, c)).join("")}</ol>
    </div>

    ${secundarias.length ? `<div class="nota" style="margin-top:1rem">
      <p class="mini">Después de tu próximo ajuste</p>
      <ul style="margin-top:.375rem">${secundarias.map((p) => `<li style="margin-top:.25rem"><button class="btn-enlace" data-accion="ir-criterio" data-ficha="${p.ficha.id}" data-crit="${p.criterio.n}">Ficha ${p.ficha.id}, criterio ${p.criterio.n}: ${esc(p.criterio.texto)}</button></li>`).join("")}</ul>

    <section style="margin-top:2.5rem">
      <h3 style="font-size:1.125rem">Preguntas de reflexión</h3>
      <p class="chico" style="margin-top:.25rem">Se guardan solas mientras escribes y viajan con esta ficha cuando la envías. Cada versión queda con su fecha en la Bitácora.</p>
      <div class="lista-reflexion" style="margin-top:1rem">
        ${preguntas.map((p, i) => {
          const clave = kr(ficha.id, i);
          return `<div>
            <label for="${clave}">${esc(p)}</label>
            <textarea id="${clave}" rows="4" data-campo="reflexion" data-clave="${clave}"

          </div>`;
        }).join("")}
      </div>
    </section>

    ${htmlEnvioFicha(ficha, calificados, puntaje)}
  </main>`;
}

function htmlEnvioFicha(ficha, calificados, puntaje) {
  const fid = ficha.id;
  const previos = enviosDe(fid);
  const ultimo = previos[previos.length - 1];
  const faltantes = validarFicha(fid);
  const mio = envio.ficha === fid;

  let cuerpo = "";
  if (mio && envio.fase === "exito") {
    cuerpo = `<div class="msg msg-ok" role="status">${esc(envio.mensaje)}</div>`;
  } else if (mio && envio.fase === "error") {
    cuerpo = `<div class="msg msg-error" role="alert">${esc(envio.mensaje)}</div>`;
  } else if (mio && envio.fase === "igual") {
    cuerpo = `<div class="msg msg-info" role="alert">${esc(envio.mensaje)}</div>`;
  } else if (mio && envio.faltantes.length) {
    cuerpo = `<div class="msg msg-info" role="alert">
      Falta completar esto antes de enviar la Ficha ${fid}:
      <ul>${envio.faltantes.slice(0, 8).map((f) => `<li>${esc(f.etiqueta)}</li>`).join("")}</ul>
    </div>`;
  }

  let etiquetaBoton;
  if (mio && envio.fase === "enviando") etiquetaBoton = "Enviando…";
  else if (faltantes.length) etiquetaBoton = "Revisar y enviar esta ficha";
  else if (mio && envio.fase === "igual") etiquetaBoton = "Enviar igual";
  else if (ultimo) etiquetaBoton = "Reenviar avance actualizado";
  else etiquetaBoton = `Enviar avance de la Ficha ${fid}`;

  return `<section class="tarjeta" style="margin-top:2rem" id="envio-${fid}">
    <h2 style="font-size:1.125rem">Enviar el avance de esta ficha</h2>
    <p class="chico" style="margin-top:.5rem;max-width:42rem">Se envía solo esta ficha: tu nombre, sus 8 puntajes, las evidencias anotadas y sus 4 reflexiones. Las otras dos fichas no se tocan. Puedes volver a enviarla cuantas veces avances; cada envío queda registrado con su fecha.</p>
    <p class="mini" style="margin-top:.5rem">Estado: ${calificados}/8 criterios calificados · ${puntaje}/16 puntos · ${reflexionesRespondidas(fid)}/4 reflexiones${ultimo ? ` · último envío: ${fechaLima(ultimo.ts)} (envío ${ultimo.envio})` : " · sin enviar todavía"}</p>
    <div class="acciones">
      <button class="btn-principal" data-accion="enviar-ficha" data-ficha="${fid}" ${mio && envio.fase === "enviando" ? "disabled" : ""}>${etiquetaBoton}</button>
      ${mio && envio.faltantes.length ? `<button data-accion="ir-faltante">Ir a lo que falta</button>` : ""}
    </div>
    <div aria-live="polite">${cuerpo}</div>
    ${previos.length > 1 ? `<details style="margin-top:1rem"><summary>Envíos anteriores de esta ficha (${previos.length - 1})</summary>
      <ul>${previos.slice(0, -1).reverse().map((e) => `<li class="version-previa">Envío ${e.envio} · ${fechaLima(e.ts)}${typeof e.subtotal === "number" ? ` · ${e.subtotal}/16 puntos` : ""}</li>`).join("")}</ul>
    </details>` : ""}
  </section>`;
}

function reflexionesRespondidas(fid) {
  return preguntasDe(fid).reduce((acc, _, i) => acc + (textoReflexion(kr(fid, i)) ? 1 : 0), 0);
}

function htmlCriterio(ficha, c) {
  const clave = kc(ficha.id, c.n);
  const valor = estado.calificaciones[clave];
  const evidencia = estado.evidencias[clave] || "";
  const opciones = [[0, "0 — No evidencia"], [1, "1 — En proceso"], [2, "2 — Logrado"]];
  return `<li class="criterio ${foco === clave ? "resaltado" : ""}" id="${clave}">
    <div class="criterio-cuerpo">
      <span class="criterio-n num">${c.n}</span>
      <div style="min-width:0;flex:1">
        <p class="chico" style="color:var(--stone-900)">${esc(c.texto)}</p>
        <p class="mini" style="margin-top:.25rem">${ETIQUETA_NIVEL[c.nivel]}</p>
        <div class="opciones" role="group" aria-label="Nivel del criterio ${c.n} de la ficha ${ficha.id}">
          ${opciones.map(([v, et]) => `<button type="button" aria-pressed="${valor === v}" data-accion="calificar" data-ficha="${ficha.id}" data-crit="${c.n}" data-valor="${v}">${et}</button>`).join("")}
        </div>
        ${(valor === 0 || valor === 1) ? `<div class="pista-caja">
          <p class="mini">Pista de ajuste</p>
          <p class="chico" style="margin-top:.125rem;color:var(--stone-700)">${esc(valor === 0 ? c.p0 : c.p1)}</p>
        </div>` : ""}
        ${valor === 2 ? `<div style="margin-top:.75rem">
          <label class="mini" for="ev-${clave}">¿Dónde se evidencia en mi ficha? (opcional)</label>
          <input id="ev-${clave}" type="text" data-campo="evidencia" data-ficha="${ficha.id}" data-crit="${c.n}"
                 value="${esc(evidencia)}" placeholder="Sección, página o elemento donde se ve.">
        </div>` : ""}
      </div>
    </div>
  </li>`;
}

/* ----- bitácora ----- */

function htmlBitacora() {
  const hayAlgo = Object.keys(estado.reflexiones || {}).length > 0;
  const linea = estado.linea || [];
  const tarjeta = (fid, i, textoPregunta) => {
    const r = estado.reflexiones[kr(fid, i)];
    const previas = estado.historial[kr(fid, i)] || [];
    return `<article class="tarjeta">
      <p class="mini">Ficha ${fid} · ${r ? fechaLima(r.ts) : "sin respuesta"}</p>
      ${textoPregunta ? `<p class="chico" style="margin-top:.5rem">${esc(textoPregunta)}</p>` : ""}
      <p class="chico" style="margin-top:.5rem;color:var(--stone-800)">${r ? esc(r.texto) : "Todavía no respondiste esta pregunta en esta ficha."}</p>
      ${previas.length ? `<details style="margin-top:.75rem"><summary>Versiones anteriores (${previas.length})</summary>
        <ul>${previas.slice().reverse().map((v) => `<li class="version-previa"><span style="display:block;color:var(--stone-400)">${fechaLima(v.ts)}</span>${esc(v.texto)}</li>`).join("")}</ul>
      </details>` : ""}
    </article>`;
  };

  return `<main>
    <h2 style="margin-top:1.5rem;font-size:1.25rem">Bitácora</h2>
    <p class="chico" style="margin-top:.5rem;max-width:42rem">Las mismas tres preguntas, respondidas en tres momentos del ciclo. Nadie las califica aquí: están para que veas cómo cambió tu propio pensamiento entre la Ficha 1 y la Ficha 3.</p>
    ${!hayAlgo ? `<p class="tarjeta chico" style="margin-top:1.5rem">Aún no hay respuestas que comparar. Responde las preguntas de reflexión al final de cualquier ficha y vuelve acá: la comparación se arma sola.</p>` : `
      <div style="margin-top:1.5rem">
        ${PREGUNTAS_COMUNES.map((pregunta, i) => `<section style="margin-top:2rem">
          <h3 style="font-size:1rem;line-height:1.35">${esc(pregunta)}</h3>
          <div class="rejilla" style="margin-top:.75rem">${FICHAS.map((f) => tarjeta(f.id, i, "")).join("")}</div>
        </section>`).join("")}
        <section style="margin-top:2rem">
          <h3 style="font-size:1rem">Cuarta pregunta de cada ficha</h3>
          <p class="chico" style="margin-top:.25rem">Esta cambia en la Ficha 3, así que va por separado.</p>
          <div class="rejilla" style="margin-top:.75rem">${FICHAS.map((f) => tarjeta(f.id, 3, f.id === 3 ? PREGUNTA_4_F3 : PREGUNTA_4_F12)).join("")}</div>
        </section>
      </div>`}
    <section style="margin-top:2.5rem">
      <h3 style="font-size:1rem">Puntaje total registrado (sobre 48)</h3>
      ${linea.length === 0
        ? `<p class="tarjeta chico" style="margin-top:.75rem">La línea de tiempo se dibuja a medida que calificas criterios. Todavía no hay registros.</p>`
        : `<ul style="margin-top:.75rem">${linea.map((p) => `<li style="display:flex;align-items:center;gap:.75rem;margin-top:.5rem">
            <span class="mini num" style="width:8rem;flex:none">${fechaLima(p.ts)}</span>
            <span class="barra"><span style="width:${Math.round((p.total / 48) * 100)}%;background:var(--teal-800)"></span></span>
            <span class="mini num" style="width:3rem;flex:none;text-align:right;color:var(--stone-700)">${p.total}</span>
          </li>`).join("")}</ul>`}
    </section>
  </main>`;
}

/* ---------- validación y envío por ficha ---------- */

function textoReflexion(clave) {
  const b = borradores[clave];
  if (b != null && b.trim()) return b.trim();
  const r = estado.reflexiones[clave];
  return r && r.texto ? r.texto : "";
}

function validarFicha(fid) {
  const faltantes = [];
  if ((estado.nombre || "").trim().length < 3) {
    faltantes.push({ tipo: "nombre", etiqueta: "Tu nombre completo (en el tablero)" });
  }
  const f = FICHAS.find((x) => x.id === fid);
  f.criterios.forEach((c) => {
    const v = estado.calificaciones[kc(fid, c.n)];
    if (v !== 0 && v !== 1 && v !== 2) {
      faltantes.push({ tipo: "criterio", ficha: fid, crit: c.n, etiqueta: `Criterio ${c.n} sin calificar` });
    }
  });
  return faltantes;
}

function datosParaEnviarFicha(fid) {
  const f = FICHAS.find((x) => x.id === fid);
  return {
    nombre: (estado.nombre || "").trim(),
    ficha: fid,
    puntajes: f.criterios.map((c) => {
      const v = estado.calificaciones[kc(fid, c.n)];
      return (v === 0 || v === 1 || v === 2) ? v : null;
    }),
    evidencias: f.criterios.map((c) => (estado.evidencias[kc(fid, c.n)] || "").trim()),
    reflexiones: preguntasDe(fid).map((_, i) => textoReflexion(kr(fid, i))),
  };
}

function firmaFicha(fid) {
  return JSON.stringify(datosParaEnviarFicha(fid));
}

function irAFaltante(f) {
  if (!f) return;
  if (f.tipo === "nombre") {
    vista = { tipo: "tablero" };
    foco = null;
    render();
    const el = document.getElementById("nombre");
    if (el) { el.classList.add("invalido"); el.focus(); }
    return;
  }
  vista = { tipo: "ficha", id: f.ficha };
  foco = f.tipo === "criterio" ? kc(f.ficha, f.crit) : f.clave;
  render();
}

async function enviarFicha(fid) {
  const faltantes = validarFicha(fid);
  if (faltantes.length) {
    envio = { fase: "normal", ficha: fid, mensaje: "", faltantes, confirmarIgual: false };
    render();
    irAFaltante(faltantes[0]);
    return;
  }

  const previos = enviosDe(fid);
  const ultimo = previos[previos.length - 1];
  if (ultimo && ultimo.firma === firmaFicha(fid) && !envio.confirmarIgual) {
    envio = {
      fase: "igual", ficha: fid, faltantes: [], confirmarIgual: true,
      mensaje: `Esta ficha no ha cambiado desde tu envío del ${fechaLima(ultimo.ts)}. Si igual quieres dejar constancia hoy, vuelve a pulsar el botón.`,
    };
    render();
    return;
  }

  envio = { fase: "enviando", ficha: fid, mensaje: "", faltantes: [], confirmarIgual: false };
  render();

  try {
    const respuesta = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(datosParaEnviarFicha(fid)),
    });
    const json = await respuesta.json();
    if (json && json.ok) {
      const registro = {
        ts: new Date().toISOString(),
        envio: json.envio || previos.length + 1,
        subtotal: json.subtotal,
        firma: firmaFicha(fid),
      };
      if (!estado.envios) estado.envios = {};
      estado.envios[fid] = [...previos, registro].slice(-20);
      guardarConDebounce();
      envio = {
        fase: "exito", ficha: fid, faltantes: [], confirmarIgual: false,
        mensaje: `Ficha ${fid} enviada el ${fechaLima(registro.ts)} (envío ${registro.envio}). Puedes seguir trabajando y reenviarla cuando avances.`,
      };
    } else {
      envio = {
        fase: "error", ficha: fid, faltantes: [], confirmarIgual: false,
        mensaje: `No se pudo registrar: ${(json && (json.error || json.msg)) || "respuesta inesperada del servidor"}. Tus datos siguen guardados en este navegador.`,
      };
    }
  } catch (e) {
    envio = {
      fase: "error", ficha: fid, faltantes: [], confirmarIgual: false,
      mensaje: "No se pudo enviar (revisa tu conexión). Nada de lo que escribiste se perdió: sigue guardado en este navegador. Intenta de nuevo en unos minutos.",
    };
  }

  render();
  const el = document.getElementById("envio-" + fid);
  if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "center" });
}

/* ---------- delegación de eventos ---------- */

document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-accion]");
  if (!b) return;
  const a = b.getAttribute("data-accion");
  const ficha = Number(b.getAttribute("data-ficha"));
  const crit = Number(b.getAttribute("data-crit"));

  if (a === "ir-tablero") { vista = { tipo: "tablero" }; foco = null; limpiarEnvio(); render(); }
  else if (a === "abrir-ficha") { vista = { tipo: "ficha", id: ficha }; foco = null; limpiarEnvio(); render(); }
  else if (a === "abrir-bitacora") { vista = { tipo: "bitacora" }; foco = null; limpiarEnvio(); render(); }
  else if (a === "ir-criterio") { vista = { tipo: "ficha", id: ficha }; foco = kc(ficha, crit); limpiarEnvio(); render(); }
  else if (a === "reiniciar-pedir") { confirmando = true; render(); }
  else if (a === "reiniciar-no") { confirmando = false; render(); }
  else if (a === "reiniciar-si") {
    try { localStorage.removeItem(CLAVE); } catch {}
    estado = JSON.parse(JSON.stringify(ESTADO_VACIO));
    borradores = {}; confirmando = false; foco = null;
    envio = { fase: "normal", ficha: null, mensaje: "", faltantes: [], confirmarIgual: false };
    vista = { tipo: "tablero" };
    render();
  }
  else if (a === "calificar") {
    const valor = Number(b.getAttribute("data-valor"));
    const clave = kc(ficha, crit);
    if (estado.calificaciones[clave] === valor) delete estado.calificaciones[clave];
    else estado.calificaciones[clave] = valor;
    const total = calcResumen().reduce((s, r) => s + r.puntaje, 0);
    registrarLinea(total);
    guardarConDebounce();
    limpiarEnvio();
    foco = clave;
    render();
    const activo = document.querySelector(`#${clave} [data-valor="${valor}"]`);
    if (activo) activo.focus();
  }
  else if (a === "enviar-ficha") enviarFicha(ficha);
  else if (a === "ir-faltante") irAFaltante(envio.faltantes[0]);
});

document.addEventListener("input", (ev) => {
  const campo = ev.target.getAttribute && ev.target.getAttribute("data-campo");
  if (!campo) return;
  ev.target.classList.remove("invalido");
  if (campo === "nombre") {
    estado.nombre = ev.target.value;
    guardarConDebounce();
  } else if (campo === "evidencia") {
    const clave = kc(Number(ev.target.getAttribute("data-ficha")), Number(ev.target.getAttribute("data-crit")));
    estado.evidencias[clave] = ev.target.value;
    guardarConDebounce();
  } else if (campo === "reflexion") {
    borradores[ev.target.getAttribute("data-clave")] = ev.target.value;
    guardarConDebounce();
    consolidarReflexiones();
  }
  if (envio.fase === "igual" || envio.fase === "exito") {
    envio = { fase: "normal", ficha: null, mensaje: "", faltantes: [], confirmarIgual: false };
  }
});

/* ---------- arranque ---------- */

cargar();
guardado = "";
render();
</script>
</body>
</html>
